data:
  raw_path: data/raw/train.csv
  stats_path: reports/data_stats.json

prepare:
  train_fraction: 0.8

train:
  random_state: 42
  models:
    LinearRegression: {}
    RandomForest:
      n_estimators: 200
      max_depth: 20
      min_samples_leaf: 2
    XGBoost:
      n_estimators: 300
      max_depth: 7
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
