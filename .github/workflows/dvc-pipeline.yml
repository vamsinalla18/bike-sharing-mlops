name: DVC versioning pipeline

# Runs the full data-versioning test (v1 -> v2 -> v3, compare, time-travel)
# on synthetic data. The real dataset is not in GitHub, so this checks that
# the workflow works, not model quality.

on:
  push:
    branches: [main, dvc-versioning-ci]
  pull_request:
    branches: [main, dvc-versioning-ci]
  workflow_dispatch:

jobs:
  versioning-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run end-to-end versioning test
        run: bash scripts/ci_e2e.sh

      - name: Upload version comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-diff
          path: ci-output/
          if-no-files-found: ignore
